<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAD 방과후 과제 업로드</title>
    <meta name="theme-color" content="#0f2f24">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <style>
        :root {
            --primary: #16a34a;
            --primary-dark: #14532d;
            --primary-soft: #f0fdf4;
            --bg-color: #f8faf9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius-lg: 18px;
            --radius-md: 12px;
            --nav-h: 64px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        [hidden] { display: none !important; }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent;
        }

        #app {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        /* 상단 네비게이션바 (Modern Glassmorphism) */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            padding-top: calc(12px + env(safe-area-inset-top, 0px));
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .brand b {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--primary-dark);
        }

        .brand small {
            display: block;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        main {
            padding: 18px;
            padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
            flex: 1;
        }

        /* 히어로 영역 */
        .hero {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-lg);
            padding: 24px 20px;
            color: #fff;
            background: linear-gradient(135deg, #0f2f24 0%, #166534 100%);
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(20, 83, 45, 0.3);
        }

        .hero h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
        .hero p { font-size: 0.88rem; opacity: 0.85; }

        .mission {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .mission-tag {
            font-size: 0.7rem;
            font-weight: 800;
            color: #14532d;
            background: #bef264;
            padding: 4px 8px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .mission-text { font-size: 0.95rem; font-weight: 700; }
        .mission-text em {
            font-style: normal;
            background: #ef4444;
            color: #fff;
            padding: 2px 6px;
            border-radius: 6px;
        }

        /* 버튼 컴포넌트 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 18px;
            border-radius: var(--radius-md);
            border: 0;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            width: 100%;
            box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
        }

        .btn-primary:hover { background: var(--primary-dark); }

        /* 게시글 카드 리드 (고화질 이미지 대응) */
        .post-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .post-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .post-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
        }

        /* 고화질 이미지 보율 렌더링 */
        .post-thumb {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            background: #f1f5f9;
            display: block;
            image-rendering: -webkit-optimize-contrast;
        }

        .post-meta { padding: 12px; }
        .post-title { font-weight: 700; font-size: 0.92rem; margin-bottom: 2px; }
        .post-author { font-size: 0.8rem; color: var(--text-muted); }

        /* 이미지 업로드 미리보기 */
        .upload-preview {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <header class="topbar">
            <div class="brand">
                <b>CAD 과제제출</b>
                <small>유한공업고등학교</small>
            </div>
        </header>

        <main>
            <section class="hero">
                <span class="hero-sub">방과후 컴퓨터응용도면</span>
                <h1>오늘의 도면 제출하기</h1>
                <p>완성된 캐드 도면 캡처 이미지를 올려주세요.</p>
                <div class="mission">
                    <span class="mission-tag">오늘의 미션</span>
                    <div class="mission-text">치수 <em>오차 ±0.5</em> 이내 맞춰 제출</div>
                </div>
            </section>

            <!-- 과제 업로드 폼 예시 영역 -->
            <div class="card" style="padding:16px; border:1px solid var(--border); border-radius:var(--radius-lg);">
                <form id="uploadForm">
                    <div style="margin-bottom:12px;">
                        <label style="font-size:0.85rem; font-weight:700; color:var(--text-muted);">도면 이미지 첨부 (고화질 자동개선)</label>
                        <input type="file" id="imageInput" accept="image/*" style="margin-top:6px; width:100%;">
                    </div>
                    <img id="preview" class="upload-preview" hidden>
                    <button type="submit" class="btn btn-primary" style="margin-top:14px;">과제 제출하기</button>
                </form>
            </div>
        </main>
    </div>

    <script>
        /**
         * CAD 도면 이미지 최적화 업로드 기능
         * 원본 도면의 얇은 선과 치수 텍스트가 뭉개지지 않도록 최상급 캔버스 렌더링 옵션 사용
         */
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        let processedBase64Image = '';

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // 고화질 처리를 위한 캔버스 세팅
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    // 1. 최대 해상도를 2048px (FHD+) 수준으로 유지하여 디테일 보존
                    const MAX_WIDTH = 2048;
                    const MAX_HEIGHT = 2048;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;

                    // 2. 선명도 및 보정 픽셀 스케일링 설정 (High Quality)
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';

                    // 3. 캔버스에 원본 이미지 그리기
                    ctx.drawImage(img, 0, 0, width, height);

                    // 4. 고품질 JPEG/PNG 인코딩 (압축률 0.95로 세팅하여 화질 저하 방지)
                    processedBase64Image = canvas.toDataURL('image/jpeg', 0.95);

                    // 미리보기 출력
                    preview.src = processedBase64Image;
                    preview.hidden = false;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!processedBase64Image) {
                alert('이미지를 선택해 주세요.');
                return;
            }
            alert('고화질 도면 이미지가 정상적으로 등록되었습니다.');
        });
    </script>
</body>
</html>
