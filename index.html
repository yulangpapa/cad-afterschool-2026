        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        [hidden] { display: none !important; }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent;
        }

        #app {
            max-width: 640px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            box-shadow: 0 0 40px rgba(0,0,0,0.03);
        }

        /* Top Header */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            padding-top: calc(14px + env(safe-area-inset-top, 0px));
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand b { display: block; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text-main); }
        .brand small { color: var(--text-muted); font-size: 0.8rem; font-weight: 500; }

        main {
            padding: 20px;
            padding-bottom: calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px));
            flex: 1;
        }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.25s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hero Banner */
        .hero {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-lg);
            padding: 24px 20px;
            color: #fff;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f766e 100%);
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
        }
        .hero-logo {
            position: absolute;
            right: -10px;
            top: -10px;
            width: 130px;
            height: 130px;
            background: var(--logo) center/contain no-repeat;
            opacity: 0.15;
            transform: rotate(12deg);
            pointer-events: none;
        }
        .hero-sub { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; font-weight: 700; }
        .hero h1 { font-size: 1.5rem; margin: 4px 0 6px; font-weight: 800; letter-spacing: -0.01em; }
        .hero p { font-size: 0.875rem; opacity: 0.85; line-height: 1.4; }

        /* Mission Tag */
        .mission {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .mission-tag {
            flex: none;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: #065f46;
            background: #6ee7b7;
            padding: 4px 10px;
            border-radius: 999px;
        }
        .mission-text { font-size: 0.95rem; font-weight: 700; }
        .mission-text em {
            font-style: normal;
            color: #fff;
            background: #ef4444;
            padding: 2px 8px;
            margin: 0 2px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            border: 0;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            width: 100%;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-small { padding: 8px 12px; font-size: 0.825rem; border-radius: 8px; }
        .btn-edit { background: var(--warning); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }

        /* Segmented Tabs */
        .seg {
            display: flex;
            gap: 6px;
            background: #f1f5f9;
            border-radius: var(--radius-md);
            padding: 5px;
            margin: 16px 0 20px;
        }
        .seg button {
            flex: 1;
            border: 0;
            background: transparent;
            padding: 10px 8px;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .seg button.on {
            background: #ffffff;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* Cards & Form Components */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            background: #ffffff;
            color: var(--text-main);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
        }

        /* FHD File Upload Component */
        .file-upload-box {
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 28px 16px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .file-upload-box:hover, .file-upload-box.dragover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .file-upload-box input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .upload-icon {
            font-size: 2rem;
            margin-bottom: 8px;
            display: block;
        }
        .upload-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .upload-hint {
            font-size: 0.775rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .fhd-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            margin-top: 6px;
        }
        .image-preview {
            margin-top: 12px;
            max-height: 200px;
            border-radius: var(--radius-md);
            object-fit: cover;
            width: 100%;
            display: none;
            border: 1px solid var(--border);
        }

        /* Post Grid */
        .post-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .post-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            background: #fff;
            box-shadow: var(--shadow-sm);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .post-card:active { transform: scale(0.98); }
        .post-thumb { width: 100%; height: 130px; object-fit: cover; background: #e2e8f0; display: block; }
        .post-meta { padding: 12px; }
        .post-title { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
    <div id="app">
        <!-- 상단 헤더 -->
        <header class="topbar">
            <div class="brand">
                <div>
                    <b>CAD 과제제출</b>
                    <small>유한공업고등학교 방과후</small>
                </div>
            </div>
        </header>

        <main>
            <!-- 메인 히어로 영역 -->
            <section class="hero">
                <div class="hero-logo"></div>
                <div class="hero-sub">AutoCAD Assignment</div>
                <h1>방과후 CAD 도면 제출</h1>
                <p>도면을 첨부하면 최적의 FHD 화질로 자동 업로드됩니다.</p>
                <div class="mission">
                    <span class="mission-tag">오늘의 미션</span>
                    <div class="mission-text">제출 도면 <em>FHD 화질</em> 확인하기</div>
                </div>
            </section>

            <!-- 탭 메뉴 -->
            <div class="seg">
                <button class="on">과제 제출하기</button>
                <button>제출 목록 보기</button>
            </div>

            <!-- 과제 업로드 폼 카드 -->
            <div class="card">
                <form id="uploadForm">
                    <div class="form-group">
                        <label for="studentName">학생 이름</label>
                        <input type="text" id="studentName" placeholder="이름을 입력하세요" required>
                    </div>

                    <div class="form-group">
                        <label for="taskTitle">과제 제목 / 도면명</label>
                        <input type="text" id="taskTitle" placeholder="예: [3주차] 브래킷 2D 도면" required>
                    </div>

                    <!-- FHD 이미지 업로드 커스텀 영역 -->
                    <div class="form-group">
                        <label>도면 이미지 첨부 (FHD 자동 변환)</label>
                        <div class="file-upload-box" id="dropZone">
                            <input type="file" id="fileInput" accept="image/*" required>
                            <span class="upload-icon">📷</span>
                            <div class="upload-title">클릭하거나 이미지를 끌어오세요</div>
                            <div class="upload-hint">PNG, JPG 지원 (최대 1920x1080 FHD 리사이징)</div>
                            <span class="fhd-badge">AUTO-FHD ENHANCE</span>
                        </div>
                        <img id="previewImage" class="image-preview" alt="업로드 이미지 미리보기">
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">과제 제출하기</button>
                </form>
            </div>
        </main>
    </div>

    <script>
        // === FHD 이미지 처리 및 업로드 관련 JS 스크립트 ===
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const uploadForm = document.getElementById('uploadForm');
        let processedFile = null;

        // FHD(1920x1080) 해상도 캔버스 변환 처리 함수
        function resizeImageToFHD(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1920;
                        const MAX_HEIGHT = 1080;
                        
                        let width = img.width;
                        let height = img.height;

                        // 비율 유지하며 FHD(1920x1080) 크기로 맞춤
                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height = Math.round((height * MAX_WIDTH) / width);
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width = Math.round((width * MAX_HEIGHT) / height);
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        // 선명한 CAD 선 표현을 위한 캔버스 보정 설정
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        ctx.drawImage(img, 0, 0, width, height);

                        // JPEG high-quality (0.92) 기반 dataURL 생성
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
                        resolve(dataUrl);
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        // 파일 선택 변경 이벤트 Listener
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                try {
                    // FHD 크기로 리사이징 변환 진행
                    const fhdDataUrl = await resizeImageToFHD(file);
                    previewImage.src = fhdDataUrl;
                    previewImage.style.display = 'block';
                    processedFile = fhdDataUrl; // 전송할 최종 FHD 이미지 데이터 저장
                } catch (error) {
                    alert('이미지를 처리하는 동안 오류가 발생했습니다.');
                    console.error(error);
                }
            }
        });

        // 폼 제출 이벤트 처리
        uploadForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if(!processedFile) {
                alert('이미지를 선택해주세요.');
                return;
            }
            alert('FHD 화질로 업로드가 완료되었습니다!');
        });
    </script>
</body>
</html>
