<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>CAD 방과후 과제 업로드</title>
    <style>
        :root{--primary:#2563eb;--primary-hover:#1d4ed8;--bg-color:#f3f4f6;--card-bg:#fff;--text-main:#1f2937;--text-muted:#6b7280;--border:#e5e7eb;--danger:#ef4444;--warning:#f59e0b}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
        body{background:var(--bg-color);color:var(--text-main);line-height:1.5}
        #app{max-width:600px;margin:0 auto;background:var(--card-bg);min-height:100vh;box-shadow:0 0 15px rgba(0,0,0,.05);display:flex;flex-direction:column}
        header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
        .header-left{display:flex;align-items:center;gap:12px}
        .home-btn{background:rgba(255,255,255,.2);border:0;color:#fff;font-size:1.1rem;padding:6px 10px;border-radius:6px;cursor:pointer}
        header h1{font-size:1.1rem;font-weight:600}
        .role-switch{background:rgba(255,255,255,.2);color:#fff;border:0;padding:6px 8px;border-radius:6px;font-size:.9rem;display:none}
        main{padding:20px;flex:1;overflow-y:auto}
        .view{display:none}.view.active{display:block}
        .btn{display:inline-block;padding:10px 16px;border-radius:8px;border:0;font-size:1rem;font-weight:500;cursor:pointer}
        .btn-primary{background:var(--primary);color:#fff;width:100%}.btn-primary:hover{background:var(--primary-hover)}
        .btn-small{padding:6px 10px;font-size:.85rem;border-radius:6px}
        .btn-edit{background:var(--warning);color:#fff}.btn-danger{background:var(--danger);color:#fff}
        .view-header{display:flex;align-items:center;margin-bottom:20px;gap:10px}
        .view-header h2{font-size:1.3rem;flex:1}
        .back-btn{background:none;border:0;font-size:1.5rem;color:var(--text-main);cursor:pointer;padding:0 5px}
        .folder-list{display:grid;grid-template-columns:1fr;gap:12px;margin-top:15px}
        .folder-item{background:var(--card-bg);border:1px solid var(--border);padding:16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
        .folder-info{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer}
        .folder-icon{font-size:1.5rem}
        .teacher-actions{display:none;gap:6px}
        .is-teacher .teacher-actions{display:flex}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;margin-bottom:6px;font-size:.9rem;color:var(--text-muted)}
        .form-group input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:1rem}
        .post-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
        .post-card{border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--card-bg)}
        .post-thumb{width:100%;height:120px;object-fit:cover;background:#e5e7eb;display:block}
        .post-meta{padding:10px}
        .post-title{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .post-author{font-size:.8rem;color:var(--text-muted);margin-top:4px}
        .post-time{font-size:.72rem;color:#9ca3af;margin-top:6px}
        .detail-img{width:100%;border-radius:8px;border:1px solid var(--border);margin-bottom:15px;cursor:zoom-in}
        .detail-title{font-size:1.2rem;font-weight:bold;margin-bottom:5px}
        .detail-author{color:var(--text-muted);font-size:.9rem;margin-bottom:6px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .detail-time{font-size:.78rem;color:#9ca3af}
        .comments-section h3{font-size:1.1rem;margin-bottom:12px}
        .comment-item{background:var(--bg-color);padding:12px;border-radius:8px;margin-bottom:8px}
        .comment-author{font-weight:600;font-size:.85rem;margin-bottom:4px;color:var(--primary)}
        .comment-text{font-size:.95rem}
        .comment-input-area{display:flex;gap:8px}
        .empty-state{text-align:center;color:var(--text-muted);padding:40px 20px}
        .loading{text-align:center;padding:20px;color:var(--text-muted)}

        /* 이미지 전체화면 모달 & 툴바 */
        #imgModal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200}
        #imgModal.show{display:flex}
        #imgModalInner{position:relative;max-width:95%;max-height:95%;overflow:hidden;touch-action:none;border-radius:8px}
        #imgModalImg{display:block;max-width:100%;max-height:100%;transform-origin:0 0;will-change:transform;cursor:grab}
        #imgModalClose{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.1);color:#fff;border:0;padding:6px 8px;border-radius:6px;cursor:pointer}
        #imgModalControls{position:absolute;left:8px;top:8px;display:flex;gap:6px}
        .modal-control{background:rgba(255,255,255,.12);color:#fff;border:0;padding:6px 8px;border-radius:6px;cursor:pointer}
        .modal-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);color:#d1d5db;font-size:.85rem}
    </style>
</head>
<body>
<div id="app">
    <header>
        <div class="header-left">
            <button class="home-btn" id="btnHome" title="처음 화면으로">🏠</button>
            <h1>CAD 방과후 과제 업로드</h1>
        </div>
        <select id="roleSelect" class="role-switch">
            <option value="student">학생 모드</option>
            <option value="teacher">교사 모드</option>
        </select>
    </header>

    <main>
        <div id="view-folder-list" class="view active">
            <div class="view-header"><h2>과제 폴더 목록</h2></div>
            <div class="teacher-actions" style="margin-bottom:15px">
                <button class="btn btn-primary" id="btnCreateFolder">+ 새 과제 폴더 만들기</button>
            </div>
            <div id="folderList" class="folder-list"><div class="loading">데이터 불러오는 중...</div></div>
        </div>

        <div id="view-folder-detail" class="view">
            <div class="view-header">
                <button class="back-btn" id="btnBackToFolders">←</button>
                <h2 id="currentFolderName">폴더명</h2>
            </div>
            <button class="btn btn-primary" style="margin-bottom:15px" id="btnShowUpload">+ 2D 도면 업로드</button>
            <div id="postList" class="post-list"></div>
        </div>

        <div id="view-upload" class="view">
            <div class="view-header">
                <button class="back-btn" id="btnBackToPosts">←</button>
                <h2>과제 업로드</h2>
            </div>
            <div class="form-group"><label>작성자 이름 (학생명)</label><input type="text" id="uploadAuthor" placeholder="예: 홍길동"></div>
            <div class="form-group"><label>도면 제목 (또는 설명)</label><input type="text" id="uploadTitle" placeholder="예: 1주차 부품 도면 완성"></div>
            <div class="form-group"><label>도면 이미지 파일 (JPG, PNG)</label><input type="file" id="uploadFile" accept="image/*"></div>
            <button class="btn btn-primary" id="btnSubmitUpload">업로드 완료 (시간이 조금 걸릴 수 있습니다)</button>
        </div>

        <div id="view-post-detail" class="view">
            <div class="view-header">
                <button class="back-btn" id="btnBackToPostsFromDetail">←</button>
                <h2>도면 상세 보기</h2>
            </div>
            <img id="detailImage" class="detail-img" src="" alt="도면 이미지">
            <div id="detailTitle" class="detail-title">제목</div>
            <div id="detailAuthor" class="detail-author">
                <span id="detailAuthorName">작성자</span>
                <span class="detail-time" id="detailCreatedAt"></span>
            </div>
            <div class="comments-section">
                <h3>💬 피드백 및 댓글</h3>
                <div id="commentList" style="margin-bottom:20px"></div>
                <div class="form-group" style="margin-bottom:8px;">
                    <input type="text" id="commentAuthor" placeholder="작성자 이름" style="padding:8px">
                </div>
                <div class="comment-input-area">
                    <input type="text" id="commentText" placeholder="피드백을 남겨주세요">
                    <button class="btn btn-primary" style="width:auto" id="btnAddComment">등록</button>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 이미지 뷰어 모달 -->
<div id="imgModal" aria-hidden="true">
    <div id="imgModalInner">
        <img id="imgModalImg" src="" alt="확대 이미지">
        <div id="imgModalControls">
            <button class="modal-control" id="zoomOutBtn">-</button>
            <button class="modal-control" id="zoomResetBtn">Reset</button>
            <button class="modal-control" id="zoomInBtn">+</button>
        </div>
        <button id="imgModalClose" aria-label="닫기">✕</button>
        <div class="modal-hint">줌: 휠 또는 + / - / 핀치, 드래그로 이동</div>
    </div>
</div>

<!-- Firebase SDK (모듈) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ★ 기존 firebaseConfig 사용 (이미 코드에 값 있음) ★
const firebaseConfig = {
  apiKey: "AIzaSyBgIWWbJrWLm75UUIxLo1HnpEZdcfAeejg",
  authDomain: "cad-afterschool-2026.firebaseapp.com",
  projectId: "cad-afterschool-2026",
  storageBucket: "cad-afterschool-2026.firebasestorage.app",
  messagingSenderId: "812762265008",
  appId: "1:812762265008:web:3dcf0dc1bbbd184d201275"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 상태
    let folders = [];
    let posts = [];
    let currentRole = 'student';
    let currentFolderId = null;
    let currentPostId = null;

    // UI 바인딩
    document.getElementById('btnHome').onclick = () => { currentFolderId = null; showView('view-folder-list'); };
    document.getElementById('roleSelect').onchange = (e) => toggleRole(e.target.value);
    document.getElementById('btnCreateFolder').onclick = showCreateFolder;
    document.getElementById('btnBackToFolders').onclick = () => { currentFolderId = null; showView('view-folder-list'); };
    document.getElementById('btnShowUpload').onclick = () => showView('view-upload');
    document.getElementById('btnBackToPosts').onclick = () => showView('view-folder-detail');
    document.getElementById('btnSubmitUpload').onclick = submitUpload;
    document.getElementById('btnBackToPostsFromDetail').onclick = () => showView('view-folder-detail');
    document.getElementById('btnAddComment').onclick = addComment;

    // URL 모드 처리
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'teacher') {
        document.getElementById('roleSelect').style.display = 'inline-block';
        document.getElementById('roleSelect').value = 'teacher';
        toggleRole('teacher');
    } else toggleRole('student');

    function toggleRole(role) {
        currentRole = role;
        if (currentRole === 'teacher') document.getElementById('app').classList.add('is-teacher');
        else document.getElementById('app').classList.remove('is-teacher');
    }
    function showView(id){ document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    // 실시간 폴더/게시글 수신
    onValue(ref(db, 'folders'), (snap) => {
        folders = []; snap.forEach(c => folders.push({ id: c.key, ...c.val() }));
        renderFolders();
    });

    onValue(ref(db, 'posts'), (snap) => {
        posts = [];
        snap.forEach(c => {
            const data = c.val();
            const comments = data.comments ? Object.keys(data.comments).map(k => ({ id:k, ...data.comments[k] })) : [];
            posts.push({
                id: c.key,
                folderId: data.folderId,
                author: data.author,
                title: data.title,
                imageUrl: data.imageUrl,
                createdAt: data.createdAt || null,
                comments: comments
            });
        });
        if (currentFolderId) renderPosts();
        if (currentPostId) {
            // 상세 열려있으면 새 데이터로 갱신
            openPost(currentPostId);
        }
    });

    // 렌더러
    function renderFolders(){
        const folderList = document.getElementById('folderList');
        folderList.innerHTML = '';
        const sorted = [...folders].sort((a,b)=>a.name.localeCompare(b.name));
        if(sorted.length===0){ folderList.innerHTML = `<div class="empty-state">생성된 과제 폴더가 없습니다.</div>`; return; }
        sorted.forEach(folder=>{
            const item = document.createElement('div'); item.className='folder-item';
            const info = document.createElement('div'); info.className='folder-info';
            info.innerHTML = `<span class="folder-icon">📁</span><span style="font-weight:600">${folder.name}</span>`;
            info.onclick = ()=>{ currentFolderId = folder.id; document.getElementById('currentFolderName').innerText = folder.name; renderPosts(); showView('view-folder-detail'); };
            const actions = document.createElement('div'); actions.className='teacher-actions';
            const editBtn = document.createElement('button'); editBtn.className='btn btn-edit btn-small'; editBtn.innerText='이름변경';
            editBtn.onclick = (e)=>{ e.stopPropagation(); const newName = prompt('변경할 폴더 이름을 입력하세요:', folder.name); if(newName && newName.trim()) update(ref(db, `folders/${folder.id}`), { name: newName.trim() }); };
            const delBtn = document.createElement('button'); delBtn.className='btn btn-danger btn-small'; delBtn.innerText='삭제';
            delBtn.onclick = (e)=>{ e.stopPropagation(); if(confirm('정말 삭제하시겠습니까?')) remove(ref(db, `folders/${folder.id}`)); };
            actions.appendChild(editBtn); actions.appendChild(delBtn);
            item.appendChild(info); item.appendChild(actions); folderList.appendChild(item);
        });
    }

    function showCreateFolder(){
        const name = prompt('새로운 과제 폴더의 이름을 입력하세요:');
        if(name && name.trim()) push(ref(db,'folders'), { name: name.trim() });
    }

    function renderPosts(){
        const postList = document.getElementById('postList'); postList.innerHTML='';
        const folderPosts = posts.filter(p=>p.folderId===currentFolderId);
        if(folderPosts.length===0){ postList.innerHTML=`<div class="empty-state" style="grid-column: span 2;">등록된 도면이 없습니다.</div>`; return; }
        folderPosts.forEach(post=>{
            const card = document.createElement('div'); card.className='post-card';
            card.onclick = ()=> openPost(post.id);
            const createdText = post.createdAt ? `<div class="post-time">${formatDate(post.createdAt)}</div>` : '';
            card.innerHTML = `<img src="${post.imageUrl}" class="post-thumb" alt="thumb">
                              <div class="post-meta">
                                  <div class="post-title">${escapeHtml(post.title)}</div>
                                  <div class="post-author">${escapeHtml(post.author)} • 댓글 ${post.comments.length}</div>
                                  ${createdText}
                              </div>`;
            postList.appendChild(card);
        });
    }

    // 이미지 압축 (기존)
    function compressImage(file, callback){
        const reader = new FileReader();
        reader.onload = function(e){
            const img = new Image();
            img.onload = function(){
                const canvas = document.createElement('canvas'); const MAX_WIDTH = 1000;
                let width = img.width, height = img.height;
                if(width > MAX_WIDTH){ height *= MAX_WIDTH/width; width = MAX_WIDTH; }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img,0,0,width,height);
                callback(canvas.toDataURL('image/jpeg',0.8));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function submitUpload(){
        const author = document.getElementById('uploadAuthor').value;
        const title = document.getElementById('uploadTitle').value;
        const fileInput = document.getElementById('uploadFile');
        if(!author || !title || fileInput.files.length===0){ alert('모두 입력해주세요.'); return; }
        document.getElementById('btnSubmitUpload').innerText = '업로드 중...'; document.getElementById('btnSubmitUpload').disabled = true;
        compressImage(fileInput.files[0], (dataUrl)=>{
            push(ref(db,'posts'), {
                folderId: currentFolderId,
                author: author,
                title: title,
                imageUrl: dataUrl,
                createdAt: Date.now()
            }).then(()=>{
                document.getElementById('btnSubmitUpload').innerText = '업로드 완료'; document.getElementById('btnSubmitUpload').disabled = false;
                document.getElementById('uploadFile').value = '';
                showView('view-folder-detail');
            });
        });
    }

    // 상세 열기 (댓글 포함, 생성시각 표기, 이미지 클릭 -> 모달)
    window.openPost = function(postId){
        currentPostId = postId;
        const post = posts.find(p=>p.id===postId); if(!post) return;
        const detailImage = document.getElementById('detailImage');
        detailImage.src = post.imageUrl;
        detailImage.onclick = ()=> openImageViewer(post.imageUrl);
        document.getElementById('detailTitle').innerText = post.title;
        document.getElementById('detailAuthorName').innerText = post.author;
        document.getElementById('detailCreatedAt').innerText = post.createdAt ? formatDate(post.createdAt) : '';
        // 댓글 렌더링
        const commentList = document.getElementById('commentList'); commentList.innerHTML = '';
        if(!post.comments || post.comments.length===0) commentList.innerHTML = `<div class="empty-state" style="padding:10px">피드백이 없습니다.</div>`;
        else {
            post.comments.forEach(c=>{
                const div = document.createElement('div'); div.className='comment-item';
                div.innerHTML = `<div class="comment-author">${escapeHtml(c.author)} <span style="color:#999;font-weight:normal;font-size:.75rem">${escapeHtml(c.date)}</span></div>
                                 <div class="comment-text">${escapeHtml(c.text)}</div>`;
                commentList.appendChild(div);
            });
        }
        showView('view-post-detail');
    };

    function addComment(){
        const authorInput = document.getElementById('commentAuthor').value;
        const textInput = document.getElementById('commentText').value;
        if(!authorInput || !textInput){ alert('입력해주세요.'); return; }
        const now = new Date();
        const dateString = `${now.getMonth()+1}/${now.getDate()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
        push(ref(db, `posts/${currentPostId}/comments`), { author: authorInput, text: textInput, date: dateString }).then(()=>{
            document.getElementById('commentText').value = '';
        });
    }

    // ------------------------------------------------------------
    // 이미지 전체화면 뷰어 (확대/축소/이동: 마우스 휠, 드래그, 더블클릭 / 터치 핀치 지원)
    // ------------------------------------------------------------
    const imgModal = document.getElementById('imgModal');
    const imgModalImg = document.getElementById('imgModalImg');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');
    const imgModalClose = document.getElementById('imgModalClose');
    let scale = 1, translateX = 0, translateY = 0;
    let isPanning = false, startX=0, startY=0, lastX=0, lastY=0;
    let pinchStartDist = 0, pinchStartScale = 1;

    function openImageViewer(src){
        imgModalImg.src = src;
        scale = 1; translateX = 0; translateY = 0; updateImageTransform();
        imgModal.classList.add('show'); imgModal.setAttribute('aria-hidden','false');
    }
    function closeImageViewer(){ imgModal.classList.remove('show'); imgModal.setAttribute('aria-hidden','true'); imgModalImg.src=''; }

    function updateImageTransform(){
        imgModalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    // 휠로 줌
    imgModalImg.addEventListener('wheel', (e)=>{
        e.preventDefault();
        const delta = -e.deltaY;
        const factor = delta > 0 ? 1.1 : 0.9;
        const newScale = clamp(scale * factor, 0.5, 5);
        // 간단한 중심 고정: 마우스 위치에 대해 약간의 translate 보정
        const rect = imgModalImg.getBoundingClientRect();
        const dx = (e.clientX - rect.left);
        const dy = (e.clientY - rect.top);
        const ratio = newScale/scale;
        translateX = translateX - (dx* (ratio - 1));
        translateY = translateY - (dy* (ratio - 1));
        scale = newScale; updateImageTransform();
    }, { passive:false });

    // 더블클릭: 리셋 / 실제 크기 토글
    imgModalImg.addEventListener('dblclick', (e)=>{
        e.preventDefault();
        if(scale === 1){ scale = 2; } else { scale = 1; translateX = 0; translateY = 0; }
        updateImageTransform();
    });

    // 마우스 드래그(팬)
    imgModalImg.addEventListener('mousedown', (e)=>{
        e.preventDefault();
        isPanning = true;
        imgModalImg.style.cursor = 'grabbing';
        startX = e.clientX; startY = e.clientY; lastX = translateX; lastY = translateY;
    });
    window.addEventListener('mousemove', (e)=>{
        if(!isPanning) return;
        e.preventDefault();
        const dx = e.clientX - startX; const dy = e.clientY - startY;
        translateX = lastX + dx; translateY = lastY + dy; updateImageTransform();
    });
    window.addEventListener('mouseup', ()=>{
        if(!isPanning) return;
        isPanning = false; imgModalImg.style.cursor = 'grab';
    });

    // 터치 이벤트: 드래그 및 핀치
    imgModalImg.addEventListener('touchstart', (e)=>{
        if(e.touches.length === 1){
            isPanning = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY; lastX = translateX; lastY = translateY;
        } else if(e.touches.length === 2){
            isPanning = false;
            pinchStartDist = getDistance(e.touches[0], e.touches[1]);
            pinchStartScale = scale;
        }
    }, { passive:false });

    imgModalImg.addEventListener('touchmove', (e)=>{
        e.preventDefault();
        if(e.touches.length === 1 && isPanning){
            const dx = e.touches[0].clientX - startX; const dy = e.touches[0].clientY - startY;
            translateX = lastX + dx; translateY = lastY + dy; updateImageTransform();
        } else if(e.touches.length === 2){
            const dist = getDistance(e.touches[0], e.touches[1]);
            const newScale = clamp(pinchStartScale * (dist / pinchStartDist), 0.5, 5);
            scale = newScale; updateImageTransform();
        }
    }, { passive:false });

    imgModalImg.addEventListener('touchend', (e)=>{
        if(e.touches.length === 0) { isPanning = false; pinchStartDist = 0; }
    });

    function getDistance(a,b){ const dx = a.clientX - b.clientX; const dy = a.clientY - b.clientY; return Math.hypot(dx,dy); }
    function clamp(v,min,max){ return Math.min(max,Math.max(min,v)); }
    function pad(n){ return n < 10 ? '0'+n : n; }

    // 컨트롤 버튼
    zoomInBtn.onclick = ()=>{ scale = clamp(scale * 1.2, 0.5, 5); updateImageTransform(); };
    zoomOutBtn.onclick = ()=>{ scale = clamp(scale * 0.85, 0.5, 5); updateImageTransform(); };
    zoomResetBtn.onclick = ()=>{ scale = 1; translateX = 0; translateY = 0; updateImageTransform(); };
    imgModalClose.onclick = closeImageViewer;
    // ESC 키로 닫기
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape'){ if(imgModal.classList.contains('show')) closeImageViewer(); } });

    // 헬퍼: 날짜 포맷
    function formatDate(ts){
        try{
            const d = new Date(Number(ts));
            return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        } catch(e){ return ''; }
    }

    // HTML 이스케이프 (XSS 방지 최소)
    function escapeHtml(s){ if(!s && s!==0) return ''; return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'); }

</script>
</body>
</html>
