<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>CAD 방과후 과제 업로드</title>
    <style>
        :root{--primary:#2563eb;--primary-hover:#1d4ed8;--bg-color:#f3f4f6;--card-bg:#fff;--text-main:#1f2937;--text-muted:#6b7280;--border:#e5e7eb;--danger:#ef4444;--warning:#f59e0b}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
        body{background:var(--bg-color);color:var(--text-main);line-height:1.5}
        #app{max-width:600px;margin:0 auto;background:var(--card-bg);min-height:100vh;box-shadow:0 0 15px rgba(0,0,0,.05);display:flex;flex-direction:column}
        header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
        .header-left{display:flex;align-items:center;gap:12px}
        .home-btn{background:rgba(255,255,255,.2);border:0;color:#fff;font-size:1.1rem;padding:6px 10px;border-radius:6px;cursor:pointer}
        header h1{font-size:1.1rem;font-weight:600}
        .role-switch{background:rgba(255,255,255,.2);color:#fff;border:0;padding:6px 8px;border-radius:6px;font-size:.9rem;display:none}
        main{padding:20px;flex:1;overflow-y:auto}
        .view{display:none}.view.active{display:block}
        .btn{display:inline-block;padding:10px 16px;border-radius:8px;border:0;font-size:1rem;font-weight:500;cursor:pointer}
        .btn:disabled{opacity:.6;cursor:not-allowed}
        .btn-primary{background:var(--primary);color:#fff;width:100%}.btn-primary:hover{background:var(--primary-hover)}
        .btn-small{padding:6px 10px;font-size:.85rem;border-radius:6px}
        .btn-edit{background:var(--warning);color:#fff}.btn-danger{background:var(--danger);color:#fff}
        .view-header{display:flex;align-items:center;margin-bottom:20px;gap:10px}
        .view-header h2{font-size:1.3rem;flex:1;word-break:break-all}
        .back-btn{background:none;border:0;font-size:1.5rem;color:var(--text-main);cursor:pointer;padding:0 5px}
        .folder-list{display:grid;grid-template-columns:1fr;gap:12px;margin-top:15px}
        .folder-item{background:var(--card-bg);border:1px solid var(--border);padding:16px;border-radius:12px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
        .folder-info{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer;min-width:0}
        .folder-icon{font-size:1.5rem}
        .folder-name{font-weight:600;word-break:break-all}
        .teacher-actions{display:none;gap:6px}
        .is-teacher .teacher-actions{display:flex}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;margin-bottom:6px;font-size:.9rem;color:var(--text-muted)}
        .form-group input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:1rem}
        .post-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
        .post-card{border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--card-bg)}
        .post-thumb{width:100%;height:120px;object-fit:cover;background:#e5e7eb;display:block}
        .post-meta{padding:10px}
        .post-title{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .post-author{font-size:.8rem;color:var(--text-muted);margin-top:4px}
        .post-time{font-size:.72rem;color:#9ca3af;margin-top:6px}
        .detail-img{width:100%;border-radius:8px;border:1px solid var(--border);margin-bottom:15px;cursor:zoom-in}
        .detail-title{font-size:1.2rem;font-weight:bold;margin-bottom:5px}
        .detail-author{color:var(--text-muted);font-size:.9rem;margin-bottom:6px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .detail-time{font-size:.78rem;color:#9ca3af}
        .comments-section h3{font-size:1.1rem;margin-bottom:12px}
        .comment-item{background:var(--bg-color);padding:12px;border-radius:8px;margin-bottom:8px}
        .comment-author{font-weight:600;font-size:.85rem;margin-bottom:4px;color:var(--primary)}
        .comment-date{font-size:.7rem;color:#999;font-weight:400;margin-left:4px}
        .comment-input-area{display:flex;gap:8px}
        .comment-input-area input{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:1rem}
        .empty-state{text-align:center;color:var(--text-muted);padding:40px 20px}
        .loading{text-align:center;padding:20px;color:var(--text-muted)}

        /* 이미지 전체화면 모달 */
        #imgModal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200;touch-action:none;overflow:hidden}
        #imgModal.show{display:flex}
        #imgModalInner{position:relative;flex:none;max-width:95%;max-height:95%;overflow:hidden;touch-action:none;border-radius:8px}
        #imgModalImg{display:block;max-width:95vw;max-height:90vh;transform-origin:0 0;will-change:transform;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
        #imgModalClose{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:5;background:rgba(0,0,0,.55);color:#fff;border:0;padding:8px 12px;border-radius:8px;font-size:1rem;cursor:pointer}
        .modal-hint{pointer-events:none;background:rgba(0,0,0,.55);padding:2px 10px;border-radius:999px}

        /* 교사용 현황 표시 */
        .teacher-only{display:block}   /* 현황 표시: 학생·교사 모두 보임. 교사만 보이게 하려면 이 줄을 display:none 으로 바꾸고 아래 줄 주석을 해제 */
        /* .is-teacher .teacher-only{display:block} */
        .folder-item .teacher-only{flex-basis:100%}
        .status-row{border-top:1px dashed var(--border);padding-top:8px}
        .status-title{font-size:.8rem;font-weight:700;color:var(--text-muted);margin-bottom:4px}
        .chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;margin:2px 4px 2px 0}
        .chip.ok{background:#dcfce7;color:#166534}
        .chip.no{background:#fee2e2;color:#991b1b}
        .post-status{font-size:.75rem;font-weight:600;margin-top:6px}
        .post-status.full,.summary-table .ok{color:#166534}
        .post-status.part,.summary-table .part{color:#b45309}
        .post-status.zero,.summary-table .no{color:#991b1b}
        #folderSummary{margin-bottom:15px}
        .summary-table{width:100%;border-collapse:collapse;font-size:.85rem}
        .summary-table th,.summary-table td{padding:6px 4px;border-bottom:1px solid var(--border);text-align:left}
        .summary-table td{font-weight:600}
        .summary-table td.who{font-weight:400;font-size:.78rem;color:var(--text-muted)}
        .form-group select{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:1rem;background:#fff}
        #commentAuthor{width:100%;border:1px solid var(--border);border-radius:8px;font-size:1rem;background:#fff}
        .modal-hint{position:absolute;z-index:5;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);color:#d1d5db;font-size:.85rem;white-space:nowrap}
    </style>
</head>
<body>
<div id="app">
    <header>
        <div class="header-left">
            <button class="home-btn" id="btnHome" title="처음 화면으로">🏠</button>
            <h1>CAD 방과후 과제 업로드</h1>
        </div>
        <select id="roleSelect" class="role-switch">
            <option value="student">학생 모드</option>
            <option value="teacher">교사 모드</option>
        </select>
    </header>

    <main>
        <!-- 폴더 목록 -->
        <div id="view-folder-list" class="view active">
            <div class="view-header"><h2>과제 폴더 목록</h2></div>
            <div class="teacher-actions" style="margin-bottom:15px">
                <button class="btn btn-primary" id="btnCreateFolder">+ 새 과제 폴더 만들기</button>
            </div>
            <div id="folderList" class="folder-list"><div class="loading" id="folderLoading">데이터베이스 연결 중...</div></div>
        </div>

        <!-- 폴더 내부 (도면 목록) -->
        <div id="view-folder-detail" class="view">
            <div class="view-header">
                <button class="back-btn" id="btnBackToFolders">←</button>
                <h2 id="currentFolderName">폴더명</h2>
            </div>
            <button class="btn btn-primary" style="margin-bottom:15px" id="btnShowUpload">+ 2D 도면 업로드</button>
            <div id="folderSummary" class="teacher-only"></div>
            <div id="postList" class="post-list"></div>
        </div>

        <!-- 업로드 화면 -->
        <div id="view-upload" class="view">
            <div class="view-header">
                <button class="back-btn" id="btnBackToPosts">←</button>
                <h2>과제 업로드</h2>
            </div>
            <div class="form-group"><label>작성자 이름 (학생명)</label><select id="uploadAuthor"></select></div>
            <div class="form-group"><label>도면 제목 (또는 설명)</label><input type="text" id="uploadTitle" placeholder="예: 1주차 부품 도면 완성"></div>
            <div class="form-group"><label>도면 이미지 파일 (JPG, PNG)</label><input type="file" id="uploadFile" accept="image/*"></div>
            <button class="btn btn-primary" id="btnSubmitUpload">업로드 완료</button>
        </div>

        <!-- 상세 보기 -->
        <div id="view-post-detail" class="view">
            <div class="view-header">
                <button class="back-btn" id="btnBackToPostsFromDetail">←</button>
                <h2>도면 상세 보기</h2>
            </div>
            <img id="detailImage" class="detail-img" src="" alt="도면 이미지">
            <div id="detailNote" class="detail-time" style="margin:-8px 0 10px"></div>
            <div id="detailTitle" class="detail-title">제목</div>
            <div id="detailAuthor" class="detail-author">
                <span id="detailAuthorName">작성자</span>
                <span class="detail-time" id="detailCreatedAt"></span>
            </div>
            <div class="comments-section">
                <h3>💬 피드백 및 댓글</h3>
                <div id="commentStatus" class="teacher-only" style="margin-bottom:12px"></div>
                <div id="commentList" style="margin-bottom:20px"></div>
                <div class="form-group" style="margin-bottom:8px;">
                    <select id="commentAuthor" style="padding:8px"></select>
                </div>
                <div class="comment-input-area">
                    <input type="text" id="commentText" placeholder="피드백을 남겨주세요">
                    <button class="btn btn-primary" style="width:auto" id="btnAddComment">등록</button>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 이미지 뷰어 모달 -->
<div id="imgModal" aria-hidden="true">
    <div id="imgModalInner">
        <img id="imgModalImg" src="" alt="확대 이미지">
    </div>
    <button id="imgModalClose" aria-label="닫기">✕</button>
    <div class="modal-hint" id="imgModalHint">핀치로 확대 · 드래그로 이동 · 두 번 탭</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ⚠️ Realtime Database 규칙(테스트 모드)은 만료일(2026-12-4) 이후 읽기/쓰기가 모두 막힙니다.
    //    그 전에 Firebase 콘솔 > Realtime Database > 규칙에서 갱신하세요.
    // ⚠️ databaseURL은 콘솔 '데이터' 탭 맨 위에 표시된 주소와 똑같아야 합니다.
    const firebaseConfig = {
      apiKey: "AIzaSyBgIWWbJrWLm75UUIxLo1HnpEZdcfAeejg",
      authDomain: "cad-afterschool-2026.firebaseapp.com",
      databaseURL: "https://cad-afterschool-2026-default-rtdb.firebaseio.com/",
      projectId: "cad-afterschool-2026",
      storageBucket: "cad-afterschool-2026.firebasestorage.app",
      messagingSenderId: "812762265008",
      appId: "1:812762265008:web:3dcf0dc1bbbd184d201275"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let folders = []; let posts = []; let currentRole = 'student';
    let currentFolderId = null; let currentPostId = null;
    const fullCache = new Map();      // 게시글 id → 원본 이미지(dataURL), 한 번 받으면 재사용
    const fullLoading = new Set();    // 현재 받는 중인 id
    let viewerPostId = null;          // 확대 보기 중인 게시글 id

    const $ = (id) => document.getElementById(id);
    function el(tag, cls, text){
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;   // textContent → HTML/스크립트 입력이 실행되지 않음
        return e;
    }
    const pad = (n) => String(n).padStart(2, '0');
    function formatDate(ts){ const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${pad(d.getMinutes())}`; }
    function showView(id){ document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); $(id).classList.add('active'); }

    // 학생 명단 (명단을 바꾸려면 여기만 수정하세요)
    const STUDENTS = ['김하율','임도윤','박재홍','윤부남','이수현','최현식','한지성','황인호'];
    const TEACHER = '선생님';
    const norm = (s) => String(s || '').replace(/\s+/g, '');

    function fillNameSelect(sel, names){
        sel.innerHTML = '';
        const first = el('option', '', '이름을 선택하세요'); first.value = ''; sel.appendChild(first);
        names.forEach(n => { const o = el('option', '', n); o.value = n; sel.appendChild(o); });
    }
    fillNameSelect($('uploadAuthor'), STUDENTS);
    fillNameSelect($('commentAuthor'), [...STUDENTS, TEACHER]);

    // 마지막으로 선택한 이름 기억 (폰에서 매번 고르지 않도록)
    function saveName(v){ try { if (STUDENTS.includes(v)) localStorage.setItem('cad_name', v); } catch (e) {} }
    function loadName(){ try { return localStorage.getItem('cad_name') || ''; } catch (e) { return ''; } }
    const savedName = loadName();
    if (STUDENTS.includes(savedName)) { $('uploadAuthor').value = savedName; $('commentAuthor').value = savedName; }
    $('uploadAuthor').addEventListener('change', (e) => saveName(e.target.value));
    $('commentAuthor').addEventListener('change', (e) => saveName(e.target.value));

    // 현황 계산
    function chip(name, ok){ return el('span', 'chip ' + (ok ? 'ok' : 'no'), (ok ? '✓ ' : '✕ ') + name); }
    function commenterSet(p){ return new Set(p.comments.map(c => norm(c.author))); }
    // 게시글 하나에 대해: 댓글을 써야 하는 학생(본인 제외) 중 누가 썼는지
    function commentStatus(p){
        const done = commenterSet(p), me = norm(p.author);
        const targets = STUDENTS.filter(n => n !== me);
        return { targets, done: targets.filter(n => done.has(n)) };
    }

    // 교사용: 폴더 안 학생별 현황표
    function renderFolderSummary(){
        const box = $('folderSummary'); box.innerHTML = '';
        if (!currentFolderId) return;
        const fp = posts.filter(p => p.folderId === currentFolderId);
        const posted = new Set(fp.map(p => norm(p.author)));

        box.appendChild(el('div', 'status-title', '학생별 현황 (게시 / 다른 학생 글에 쓴 댓글)'));
        const table = el('table', 'summary-table');
        const head = el('tr');
        ['학생', '게시', '댓글', '댓글 목록'].forEach(t => head.appendChild(el('th', '', t)));
        table.appendChild(head);

        STUDENTS.forEach((n) => {
            const others = fp.filter(p => norm(p.author) !== n);
            const written = others.filter(p => commenterSet(p).has(n)).length;
            const tr = el('tr');
            tr.appendChild(el('td', '', n));
            tr.appendChild(el('td', posted.has(n) ? 'ok' : 'no', posted.has(n) ? '✓ 게시' : '✕ 미게시'));
            if (others.length === 0) tr.appendChild(el('td', '', '-'));
            else tr.appendChild(el('td', written === others.length ? 'ok' : written === 0 ? 'no' : 'part', `${written}/${others.length}`));
            // 이 학생이 댓글을 쓴 상대 (명단 순서)
            const to = STUDENTS.filter(x => others.some(q => norm(q.author) === x && commenterSet(q).has(n)));
            tr.appendChild(el('td', 'who', to.length ? to.join(', ') : '-'));
            table.appendChild(tr);
        });
        box.appendChild(table);
    }

    // ---------- 이벤트 바인딩 ----------
    $('btnHome').onclick = () => { currentFolderId = null; currentPostId = null; showView('view-folder-list'); };
    $('roleSelect').onchange = (e) => toggleRole(e.target.value);
    $('btnBackToFolders').onclick = () => { currentFolderId = null; currentPostId = null; showView('view-folder-list'); };
    $('btnShowUpload').onclick = () => showView('view-upload');
    $('btnBackToPosts').onclick = () => showView('view-folder-detail');
    $('btnSubmitUpload').onclick = submitUpload;
    $('btnBackToPostsFromDetail').onclick = () => { currentPostId = null; showView('view-folder-detail'); };
    $('btnAddComment').onclick = addComment;
    $('commentText').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) addComment(); });

    // 폴더 생성
    $('btnCreateFolder').onclick = () => {
        const folderName = prompt('새로운 과제 폴더의 이름을 입력하세요:\n(예: 11/4)동력전달장치04)');
        if (folderName && folderName.trim()) {
            push(ref(db, 'folders'), { name: folderName.trim() })
            .catch((error) => { alert("폴더 생성 실패!\n\n원인: " + error.message); });
        }
    };

    // 초기 모드 설정 (?mode=teacher)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'teacher') {
        $('roleSelect').style.display = 'inline-block';
        $('roleSelect').value = 'teacher';
        toggleRole('teacher');
    } else toggleRole('student');

    function toggleRole(role){
        currentRole = role;
        $('app').classList.toggle('is-teacher', role === 'teacher');
        const ca = $('commentAuthor');
        if (role === 'teacher') ca.value = TEACHER;                 // 교사 모드: 댓글 작성자 기본값 '선생님'
        else if (ca.value === TEACHER) ca.value = STUDENTS.includes(savedName) ? savedName : '';
    }

    // ---------- 데이터 수신 ----------
    onValue(ref(db, 'folders'), (snap) => {
        console.log('folders:', snap.val());   // 콘솔에서 실제 받아온 데이터 확인용
        folders = [];
        // ⚠️ forEach 콜백이 true로 평가되는 값을 반환하면 반복이 중단됩니다. 반드시 중괄호로 감싸세요.
        snap.forEach((c) => {
            const v = c.val();
            if (typeof v === 'string') folders.push({ id: c.key, name: v });          // 콘솔에서 문자열로 직접 넣은 경우
            else if (v && typeof v === 'object') folders.push({ id: c.key, ...v });
        });
        renderFolders();
        // 선택된 폴더 이름이 바뀌었을 때 제목 갱신
        if (currentFolderId) {
            const f = folders.find(x => x.id === currentFolderId);
            if (f) $('currentFolderName').textContent = f.name;
        }
    }, (error) => {
        console.error(error);
        const loading = $('folderLoading');
        if (loading) loading.textContent = "데이터 연결 실패!";
        alert("폴더를 불러오지 못했습니다.\n원인: " + error.message + "\n\nFirebase Rules(만료일)와 databaseURL을 확인해주세요.");
    });

    onValue(ref(db, 'posts'), (snap) => {
        console.log('posts:', snap.size, '개');
        posts = [];
        snap.forEach((c) => {
            const data = c.val() || {};
            const comments = data.comments ? Object.keys(data.comments).map(k => ({ id: k, ...data.comments[k] })) : [];
            posts.push({ id: c.key, ...data, comments });
        });
        renderFolders();                                       // 폴더별 게시 현황 갱신
        if (currentFolderId) { renderPosts(); renderFolderSummary(); }
        if (currentPostId) renderPostDetail(currentPostId);   // 화면 전환 없이 내용만 갱신
    }, (error) => {
        console.error(error);
        alert("자료 불러오기 실패: " + error.message);
    });

    // ---------- 폴더 ----------
    function renderFolders(){
        const list = $('folderList'); list.innerHTML = '';

        const sorted = folders
            .filter(f => f && f.name)
            // 숫자를 숫자 크기로 비교 → 11/4 가 11/10 보다 앞에 옴
            .sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko', { numeric: true }));

        if (sorted.length === 0) { list.appendChild(el('div', 'empty-state', '생성된 과제 폴더가 없습니다.')); return; }

        sorted.forEach((f) => {
            const item = el('div', 'folder-item');

            const info = el('div', 'folder-info');
            info.appendChild(el('span', 'folder-icon', '📁'));
            info.appendChild(el('span', 'folder-name', f.name));
            info.addEventListener('click', () => openFolder(f.id, f.name));

            const actions = el('div', 'teacher-actions');
            const editBtn = el('button', 'btn btn-edit btn-small', '변경');
            editBtn.addEventListener('click', () => editFolder(f.id, f.name));
            const delBtn = el('button', 'btn btn-danger btn-small', '삭제');
            delBtn.addEventListener('click', () => deleteFolder(f.id, f.name));
            actions.append(editBtn, delBtn);

            // 교사용: 이 폴더에 누가 게시했는지
            const posted = new Set(posts.filter(p => p.folderId === f.id).map(p => norm(p.author)));
            const status = el('div', 'teacher-only status-row');
            status.appendChild(el('div', 'status-title', `게시 ${STUDENTS.filter(n => posted.has(n)).length}/${STUDENTS.length}`));
            STUDENTS.forEach(n => status.appendChild(chip(n, posted.has(n))));

            item.append(info, actions, status);
            list.appendChild(item);
        });
    }

    function openFolder(id, name){
        currentFolderId = id;
        $('currentFolderName').textContent = name;
        renderPosts();
        renderFolderSummary();
        showView('view-folder-detail');
    }

    function editFolder(id, old){
        const n = prompt('새 이름:', old);
        if (n && n.trim()) update(ref(db, `folders/${id}`), { name: n.trim() }).catch(e => alert("수정 실패: " + e.message));
    }

    function deleteFolder(id, name){
        const related = posts.filter(p => p.folderId === id);
        const msg = related.length
            ? `"${name}" 폴더와 안에 있는 도면 ${related.length}개를 모두 삭제할까요?\n(되돌릴 수 없습니다)`
            : `"${name}" 폴더를 삭제할까요?`;
        if (!confirm(msg)) return;
        // 폴더와 그 안의 도면을 한 번에 삭제 (고아 데이터 방지)
        const updates = {};
        updates[`folders/${id}`] = null;
        related.forEach(p => { updates[`posts/${p.id}`] = null; updates[`images/${p.id}`] = null; });
        update(ref(db), updates).catch(e => alert("삭제 실패: " + e.message));
    }

    // ---------- 도면 목록 ----------
    function renderPosts(){
        const list = $('postList'); list.innerHTML = '';
        const filtered = posts
            .filter(p => p.folderId === currentFolderId)
            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));   // 최신순

        if (filtered.length === 0) {
            const empty = el('div', 'empty-state', '과제가 없습니다.');
            empty.style.gridColumn = 'span 2';
            list.appendChild(empty);
            return;
        }

        filtered.forEach((p) => {
            const card = el('div', 'post-card');
            card.addEventListener('click', () => openPost(p.id));

            const img = el('img', 'post-thumb');
            img.src = p.thumbUrl || p.imageUrl || '';
            img.alt = p.title || '';

            const meta = el('div', 'post-meta');
            meta.appendChild(el('div', 'post-title', p.title || '(제목 없음)'));
            meta.appendChild(el('div', 'post-author', `${p.author || '이름 없음'} • 댓글 ${p.comments.length}`));
            meta.appendChild(el('div', 'post-time', p.createdAt ? formatDate(p.createdAt) : ''));
            const cs = commentStatus(p);   // 교사용: 댓글 작성 현황
            meta.appendChild(el('div', 'teacher-only post-status ' + (cs.done.length === cs.targets.length ? 'full' : cs.done.length === 0 ? 'zero' : 'part'), `💬 댓글 ${cs.done.length}/${cs.targets.length}`));

            card.append(img, meta);
            list.appendChild(card);
        });
    }

    // ---------- 업로드 ----------
    const FULL_SIDE = 2400;                 // 원본: 긴 변 최대 픽셀 (기존 1800)
    const FULL_BYTES = 1.5 * 1024 * 1024;   // 원본 목표 용량 약 1.5MB (기존 700KB)
    const THUMB_SIDE = 520;                 // 목록용 썸네일
    const THUMB_BYTES = 50 * 1024;

    // 긴 변 maxSide 이하로 줄이고, 목표 용량을 넘으면 화질 → 크기 순으로 조금씩 낮춤
    function compressImage(img, maxSide, targetBytes, qualities){
        let scale = Math.min(1, maxSide / Math.max(img.width, img.height));   // 작은 이미지는 키우지 않음
        let url = '';
        for (let attempt = 0; attempt < 4; attempt++) {
            const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
            const cvs = document.createElement('canvas'); cvs.width = w; cvs.height = h;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);   // 투명 PNG가 검게 저장되는 것 방지
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, w, h);
            for (const q of qualities) {
                url = cvs.toDataURL('image/jpeg', q);
                if (url.length * 0.75 <= targetBytes) return url;
            }
            scale *= 0.85;
        }
        return url;
    }

    function submitUpload(){
        const author = $('uploadAuthor').value.trim();
        const title = $('uploadTitle').value.trim();
        const file = $('uploadFile').files[0];
        if (!author || !title || !file) return alert('모두 입력해주세요!');
        if (!currentFolderId) return alert('폴더를 먼저 선택해주세요.');

        const btn = $('btnSubmitUpload');
        const resetBtn = () => { btn.disabled = false; btn.textContent = '업로드 완료'; };
        btn.disabled = true; btn.textContent = '업로드 중...';

        const r = new FileReader();
        r.onerror = () => { alert('파일을 읽지 못했습니다.'); resetBtn(); };
        r.onload = (e) => {
            const img = new Image();
            img.onerror = () => { alert('이미지 파일이 아닙니다.'); resetBtn(); };
            img.onload = () => {
                const imageUrl = compressImage(img, FULL_SIDE, FULL_BYTES, [0.95, 0.92, 0.88, 0.84]);
                const thumbUrl = compressImage(img, THUMB_SIDE, THUMB_BYTES, [0.8, 0.7, 0.6]);
                const key = push(ref(db, 'posts')).key;   // 키만 먼저 만듦 (아직 저장 안 됨)
                const updates = {};
                updates[`posts/${key}`] = { folderId: currentFolderId, author, title, thumbUrl, createdAt: Date.now() };
                updates[`images/${key}`] = imageUrl;       // 원본은 별도 경로 → 목록 열 때 내려받지 않음
                update(ref(db), updates)
                .then(() => {
                    $('uploadTitle').value = ''; $('uploadFile').value = '';   // 이름은 남겨 두어 연속 업로드 편하게
                    resetBtn();
                    showView('view-folder-detail');
                })
                .catch((error) => { alert("업로드 실패!\n원인: " + error.message); resetBtn(); });
            };
            img.src = e.target.result;
        };
        r.readAsDataURL(file);
    }

    // ---------- 상세 / 댓글 ----------
    function openPost(id){
        currentPostId = id;
        if (renderPostDetail(id)) showView('view-post-detail');
        else currentPostId = null;
    }

    // 내용만 그림 (화면 전환 없음) → DB가 바뀌어도 다른 화면으로 끌려가지 않음
    function renderPostDetail(id){
        const p = posts.find(x => x.id === id);
        if (!p) return false;
        const dimg = $('detailImage');
        const shown = fullCache.get(id) || p.thumbUrl || p.imageUrl || '';
        if (dimg.getAttribute('src') !== shown) dimg.src = shown;   // 실시간 갱신 때 깜빡이지 않게
        dimg.onclick = () => { viewerPostId = id; openImageViewer(fullCache.get(id) || p.imageUrl || p.thumbUrl); };
        if (p.thumbUrl && !fullCache.has(id)) { $('detailNote').textContent = '원본 화질 불러오는 중...'; loadFull(id); }
        else $('detailNote').textContent = '';
        $('detailTitle').textContent = p.title || '';
        $('detailAuthorName').textContent = p.author || '';
        $('detailCreatedAt').textContent = p.createdAt ? formatDate(p.createdAt) : '';

        // 교사용: 누가 댓글을 썼는지 / 안 썼는지
        const cs = commentStatus(p), sbox = $('commentStatus'); sbox.innerHTML = '';
        sbox.appendChild(el('div', 'status-title', `댓글 작성 현황 ${cs.done.length}/${cs.targets.length}`));
        cs.targets.forEach(n => sbox.appendChild(chip(n, cs.done.includes(n))));

        const cList = $('commentList'); cList.innerHTML = '';
        if (p.comments.length === 0) cList.appendChild(el('div', 'empty-state', '피드백이 없습니다.'));
        else p.comments.forEach((c) => {
            const d = el('div', 'comment-item');
            const head = el('div', 'comment-author', c.author || '');
            head.appendChild(el('span', 'comment-date', c.date || ''));
            d.append(head, el('div', 'comment-text', c.text || ''));
            cList.appendChild(d);
        });
        return true;
    }

    // 원본 이미지는 필요할 때만 받아옴 (images/<id>)
    function loadFull(id){
        if (fullCache.has(id) || fullLoading.has(id)) return;
        fullLoading.add(id);
        get(ref(db, `images/${id}`)).then((snap) => {
            const v = snap.val();
            if (typeof v !== 'string') throw new Error('원본 이미지가 없습니다');
            fullCache.set(id, v);
            if (currentPostId === id) { $('detailImage').src = v; $('detailNote').textContent = ''; }
            if (viewerPostId === id && m.classList.contains('show')) mi.src = v;   // 확대 보기 중이면 원본으로 교체
        }).catch((e) => {
            console.error(e);
            if (currentPostId === id) $('detailNote').textContent = '원본을 불러오지 못했습니다 (축소본 표시 중)';
        }).finally(() => { fullLoading.delete(id); });
    }

    function addComment(){
        const a = $('commentAuthor').value.trim();
        const t = $('commentText').value.trim();
        if (!a || !t || !currentPostId) return;
        const now = new Date();
        const ds = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${pad(now.getMinutes())}`;
        push(ref(db, `posts/${currentPostId}/comments`), { author: a, text: t, date: ds })
        .then(() => { $('commentText').value = ''; })
        .catch(e => alert("댓글 달기 실패: " + e.message));
    }

    // ---------- 이미지 확대 보기 (핀치 줌 / 드래그 / 두 번 탭) ----------
    const m = $('imgModal'); const mi = $('imgModalImg'); const inner = $('imgModalInner');
    let scale = 1, tx = 0, ty = 0;
    let rot = 0, wantLandscape = false;   // rot: 0 또는 90 (세로 화면에서 가로 도면을 눕혀 보여줄 때)
    const toLocal = (dx, dy) => rot ? [dy, -dx] : [dx, dy];   // 화면 이동량 → 이미지 기준 이동량
    const MIN_SCALE = 1, MAX_SCALE = 8;

    function updateT(){
        const W = mi.offsetWidth, H = mi.offsetHeight;
        if (scale <= 1.001) { scale = 1; tx = 0; ty = 0; }
        else {   // 이미지가 화면 밖으로 사라지지 않게 이동 범위 제한
            tx = Math.min(0, Math.max(W - W * scale, tx));
            ty = Math.min(0, Math.max(H - H * scale, ty));
        }
        mi.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    }
    // 화면 좌표 (cx, cy)를 기준점으로 확대/축소
    function zoomAt(newScale, cx, cy){
        newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
        const r = inner.getBoundingClientRect();
        const [lx, ly] = toLocal(cx - (r.left + r.width / 2), cy - (r.top + r.height / 2));
        const px = mi.offsetWidth / 2 + lx, py = mi.offsetHeight / 2 + ly, k = newScale / scale;
        tx = px - (px - tx) * k; ty = py - (py - ty) * k;
        scale = newScale; updateT();
    }
    // 폰에서만 동작: 가로로 긴 도면은 가로 화면에 꽉 차게
    function isPhone(){ return matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600; }

    async function tryLockLandscape(){   // 안드로이드 크롬: 전체화면 + 가로 고정 (iOS 사파리는 미지원 → 아래 CSS 회전으로 대체)
        try {
            if (m.requestFullscreen && !document.fullscreenElement) await m.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
        } catch (e) { /* 미지원/거부 시 무시 */ }
    }

    function layoutViewer(force){
        if (!m.classList.contains('show')) return;
        const vw = window.innerWidth, vh = window.innerHeight;
        // 세로 화면 + 가로로 긴 이미지 → 90도 눕혀서 폰을 돌리면 꽉 차게. 폰이 가로가 되면(자동 회전) 회전을 풀어줌
        const newRot = (wantLandscape && mi.naturalWidth > mi.naturalHeight && vh > vw) ? 90 : 0;
        const changed = force || newRot !== rot;
        rot = newRot;
        inner.style.maxWidth = inner.style.maxHeight = wantLandscape ? 'none' : '';
        inner.style.transform = rot ? 'rotate(90deg)' : '';
        if (wantLandscape) { mi.style.maxWidth = (rot ? vh : vw) + 'px'; mi.style.maxHeight = (rot ? vw : vh) + 'px'; }
        else { mi.style.maxWidth = ''; mi.style.maxHeight = ''; }
        $('imgModalHint').textContent = rot ? '📱 폰을 옆으로 돌려 보세요 · 핀치로 확대 · 두 번 탭' : '핀치로 확대 · 드래그로 이동 · 두 번 탭';
        if (changed) { scale = 1; tx = 0; ty = 0; }
        updateT();
    }
    mi.addEventListener('load', () => layoutViewer(true));
    window.addEventListener('resize', () => layoutViewer(false));

    function openImageViewer(s){
        wantLandscape = isPhone();
        if (wantLandscape) tryLockLandscape();   // 클릭 직후에 호출해야 전체화면 허용됨
        mi.src = s; scale = 1; tx = 0; ty = 0; pts.clear();
        m.classList.add('show');
        layoutViewer(true);
    }
    function closeViewer(){
        m.classList.remove('show');
        viewerPostId = null;
        wantLandscape = false;
        try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
        try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    }

    $('imgModalClose').onclick = closeViewer;
    m.addEventListener('click', (e) => { if (e.target === m) closeViewer(); });
    ['gesturestart', 'gesturechange'].forEach(t => m.addEventListener(t, (e) => e.preventDefault()));   // iOS 사파리 기본 확대 방지

    // 마우스 휠 (PC)
    mi.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(scale * (e.deltaY < 0 ? 1.1 : 0.9), e.clientX, e.clientY); }, { passive: false });

    // 터치/마우스 포인터: 한 손가락 = 이동, 두 손가락 = 핀치 줌, 두 번 탭 = 확대/원래대로
    const pts = new Map();
    let lastDist = 0, lastCx = 0, lastCy = 0, lastTap = 0;
    function pinchInfo(){
        const [a, b] = [...pts.values()];
        return { d: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
    }
    mi.addEventListener('pointerdown', (e) => {
        mi.setPointerCapture(e.pointerId);
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pts.size === 2) {
            const i = pinchInfo(); lastDist = i.d; lastCx = i.cx; lastCy = i.cy; lastTap = 0;
        } else if (pts.size === 1) {
            const now = Date.now();
            if (now - lastTap < 300) {
                if (scale > 1) { scale = 1; updateT(); } else zoomAt(2.5, e.clientX, e.clientY);
                lastTap = 0;
            } else lastTap = now;
        }
    });
    mi.addEventListener('pointermove', (e) => {
        const p = pts.get(e.pointerId); if (!p) return;
        if (pts.size === 1 && scale > 1) { const [ddx, ddy] = toLocal(e.clientX - p.x, e.clientY - p.y); tx += ddx; ty += ddy; updateT(); }
        p.x = e.clientX; p.y = e.clientY;
        if (pts.size === 2 && lastDist > 0) {
            const i = pinchInfo();
            { const [ddx, ddy] = toLocal(i.cx - lastCx, i.cy - lastCy); tx += ddx; ty += ddy; }               // 두 손가락 중심 이동 = 화면 이동
            zoomAt(scale * i.d / lastDist, i.cx, i.cy);             // 손가락 간격 변화 = 확대/축소
            lastDist = i.d; lastCx = i.cx; lastCy = i.cy;
        }
    });
    const endPointer = (e) => { pts.delete(e.pointerId); };
    mi.addEventListener('pointerup', endPointer);
    mi.addEventListener('pointercancel', endPointer);
    mi.addEventListener('dragstart', (e) => e.preventDefault());
</script>
</body>
</html>
